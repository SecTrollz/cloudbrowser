version: "3.9"

# ╔═══════════════════════════════════════════════════════╗
# ║           TOAST BROWSER — Single User Stack           ║
# ║  Isolated, fingerprint-separated browser profiles     ║
# ║  Built on KasmVNC open source streaming technology    ║
# ╚═══════════════════════════════════════════════════════╝
#
# Traffic capture (handibot integration, see ./proxy/README.md):
#   - Every profile gets SSLKEYLOGFILE set - the default, no-CA capture
#     path. The `traffic_capture` sidecar below passively decrypts each
#     profile's traffic live using those keys; nothing is in the path.
#   - The 5 non-Tor profiles also mount ./proxy/entrypoint-wrapper.sh +
#     ./proxy/runtime/<profile>/ - an opt-in, per-profile, ephemeral CA
#     fallback for when a rule needs to actually block something
#     (`handibot proxy-ca-start <profile>`). Each profile has its own CA/
#     port; none of this is baked into the image at build time, so turning
#     it on/off/rotating it is just `docker compose restart <profile>`.
#   - browser_research (Tor) only gets SSLKEYLOGFILE - no CA/proxy wiring,
#     see the comment on that service for why.

networks:
  toast_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  profile_work:
  profile_personal:
  profile_research:
  profile_social:
  profile_banking:
  profile_dev:
  dashboard_data:

services:

  # ─────────────────────────────────────────────
  # Dashboard — The control panel UI
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toast_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dashboard_data:/data
      - ./profiles:/profiles:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    environment:
      - TOAST_SECRET=${TOAST_SECRET:-changeme_use_env_file}
    networks:
      toast_net:
        ipv4_address: 172.20.0.2
    labels:
      - "toast.role=dashboard"

  # ─────────────────────────────────────────────
  # handibot's default traffic-capture path: passive SSLKEYLOGFILE
  # decryption. Privileged (NET_RAW/NET_ADMIN) so raw packet capture works
  # with no host-level sudo/setcap - see ./proxy/README.md.
  # handibot's KeylogCaptureService launches/stops tshark in here via
  # `docker exec`, it doesn't run anything itself by default.
  # ─────────────────────────────────────────────
  traffic_capture:
    build:
      context: ./proxy/sidecar
      dockerfile: Dockerfile
    container_name: toast_traffic_capture
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./data/keylogs:/keylog
    networks:
      toast_net:
        ipv4_address: 172.20.0.3
    labels:
      - "toast.role=traffic_capture"

  # ─────────────────────────────────────────────
  # PROFILE: Work — Chrome, professional persona
  # ─────────────────────────────────────────────
  browser_work:
    image: kasmweb/chrome:1.16.0
    container_name: toast_work
    restart: unless-stopped
    shm_size: "512m"
    user: root
    entrypoint: ["/handibot-proxy-mount/entrypoint-wrapper.sh"]
    ports:
      - "0.0.0.0:6901:6901"
    volumes:
      - profile_work:/home/kasm-user
      - ./proxy/entrypoint-wrapper.sh:/handibot-proxy-mount/entrypoint-wrapper.sh:ro
      - ./proxy/runtime/work:/handibot-proxy-mount/runtime:ro
      - ./data/keylogs/work:/keylog
    environment:
      - VNC_PW=${WORK_VNC_PW:-workpass123}
      - KASM_SVC_AUDIO=0
      # Fingerprint overrides
      - LANG=en-US
      - TZ=America/New_York
      - VNCOPTIONS=-SecurityTypes None
      - HANDIBOT_BROWSER_ENGINE=chrome
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.10
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=work"
      - "toast.browser=chrome"
      - "toast.color=#3B82F6"
      - "toast.icon=💼"
      - "toast.port=6901"

  # ─────────────────────────────────────────────
  # PROFILE: Personal — Firefox, home persona
  # ─────────────────────────────────────────────
  browser_personal:
    image: kasmweb/firefox:1.16.0
    container_name: toast_personal
    restart: unless-stopped
    shm_size: "512m"
    user: root
    entrypoint: ["/handibot-proxy-mount/entrypoint-wrapper.sh"]
    ports:
      - "0.0.0.0:6902:6901"
    volumes:
      - profile_personal:/home/kasm-user
      - ./proxy/entrypoint-wrapper.sh:/handibot-proxy-mount/entrypoint-wrapper.sh:ro
      - ./proxy/runtime/personal:/handibot-proxy-mount/runtime:ro
      - ./data/keylogs/personal:/keylog
    environment:
      - VNC_PW=${PERSONAL_VNC_PW:-personalpass123}
      - KASM_SVC_AUDIO=0
      - LANG=en-GB
      - TZ=Europe/London
      - VNCOPTIONS=-SecurityTypes None
      - HANDIBOT_BROWSER_ENGINE=firefox
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.11
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=personal"
      - "toast.browser=firefox"
      - "toast.color=#F97316"
      - "toast.icon=🏠"
      - "toast.port=6902"

  # ─────────────────────────────────────────────
  # PROFILE: Research — Tor Browser, anonymous
  # Deliberately NOT routed through handibot's CA/mitmproxy fallback -
  # forcing a forward proxy on top of Tor's own circuit routing conflicts
  # with the point of this profile and could weaken its anonymity. It DOES
  # get SSLKEYLOGFILE set (harmless - just logs a secret Firefox already
  # computes locally, doesn't touch Tor's routing) though its useful yield
  # is low (decrypts only the outer hop to the guard relay, not the
  # destination site, since that's onion-wrapped). See
  # ./proxy/README.md "Why browser_research is excluded".
  # ─────────────────────────────────────────────
  browser_research:
    image: kasmweb/tor-browser:1.16.0
    container_name: toast_research
    restart: unless-stopped
    shm_size: "512m"
    ports:
      - "0.0.0.0:6903:6901"
    volumes:
      - profile_research:/home/kasm-user
      - ./data/keylogs/research:/keylog
    environment:
      - VNC_PW=${RESEARCH_VNC_PW:-researchpass123}
      - KASM_SVC_AUDIO=0
      - LANG=de-DE
      - TZ=Europe/Berlin
      - VNCOPTIONS=-SecurityTypes None
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.12
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=research"
      - "toast.browser=tor"
      - "toast.color=#8B5CF6"
      - "toast.icon=🔬"
      - "toast.port=6903"

  # ─────────────────────────────────────────────
  # PROFILE: Social — Chrome, social media
  # ─────────────────────────────────────────────
  browser_social:
    image: kasmweb/chrome:1.16.0
    container_name: toast_social
    restart: unless-stopped
    shm_size: "512m"
    user: root
    entrypoint: ["/handibot-proxy-mount/entrypoint-wrapper.sh"]
    ports:
      - "0.0.0.0:6904:6901"
    volumes:
      - profile_social:/home/kasm-user
      - ./proxy/entrypoint-wrapper.sh:/handibot-proxy-mount/entrypoint-wrapper.sh:ro
      - ./proxy/runtime/social:/handibot-proxy-mount/runtime:ro
      - ./data/keylogs/social:/keylog
    environment:
      - VNC_PW=${SOCIAL_VNC_PW:-socialpass123}
      - KASM_SVC_AUDIO=0
      - LANG=en-AU
      - TZ=Australia/Sydney
      - VNCOPTIONS=-SecurityTypes None
      - HANDIBOT_BROWSER_ENGINE=chrome
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.13
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=social"
      - "toast.browser=chrome"
      - "toast.color=#EC4899"
      - "toast.icon=📱"
      - "toast.port=6904"

  # ─────────────────────────────────────────────
  # PROFILE: Banking — Firefox, financial
  # ─────────────────────────────────────────────
  browser_banking:
    image: kasmweb/firefox:1.16.0
    container_name: toast_banking
    restart: unless-stopped
    shm_size: "512m"
    user: root
    entrypoint: ["/handibot-proxy-mount/entrypoint-wrapper.sh"]
    ports:
      - "0.0.0.0:6905:6901"
    volumes:
      - profile_banking:/home/kasm-user
      - ./proxy/entrypoint-wrapper.sh:/handibot-proxy-mount/entrypoint-wrapper.sh:ro
      - ./proxy/runtime/banking:/handibot-proxy-mount/runtime:ro
      - ./data/keylogs/banking:/keylog
    environment:
      - VNC_PW=${BANKING_VNC_PW:-bankingpass123}
      - KASM_SVC_AUDIO=0
      - LANG=en-US
      - TZ=America/Chicago
      - VNCOPTIONS=-SecurityTypes None
      - HANDIBOT_BROWSER_ENGINE=firefox
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.14
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=banking"
      - "toast.browser=firefox"
      - "toast.color=#10B981"
      - "toast.icon=🏦"
      - "toast.port=6905"

  # ─────────────────────────────────────────────
  # PROFILE: Dev — Chromium, development
  # ─────────────────────────────────────────────
  browser_dev:
    image: kasmweb/chromium:1.16.0
    container_name: toast_dev
    restart: unless-stopped
    shm_size: "512m"
    user: root
    entrypoint: ["/handibot-proxy-mount/entrypoint-wrapper.sh"]
    ports:
      - "0.0.0.0:6906:6901"
    volumes:
      - profile_dev:/home/kasm-user
      - ./proxy/entrypoint-wrapper.sh:/handibot-proxy-mount/entrypoint-wrapper.sh:ro
      - ./proxy/runtime/dev:/handibot-proxy-mount/runtime:ro
      - ./data/keylogs/dev:/keylog
    environment:
      - VNC_PW=${DEV_VNC_PW:-devpass123}
      - KASM_SVC_AUDIO=0
      - LANG=en-US
      - TZ=America/Los_Angeles
      - VNCOPTIONS=-SecurityTypes None
      - HANDIBOT_BROWSER_ENGINE=chromium
      - SSLKEYLOGFILE=/keylog/keylog.log
    networks:
      toast_net:
        ipv4_address: 172.20.0.15
    security_opt:
      - no-new-privileges:true
    labels:
      - "toast.role=browser"
      - "toast.profile=dev"
      - "toast.browser=chromium"
      - "toast.color=#BE721B"
      - "toast.icon=🍞"
      - "toast.port=6906"
